<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Agenda</title>
    <meta name="description" content="Agenda única: reuniões do Outlook, compromissos pessoais do Google e suas demandas." />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; form-action 'self' https://accounts.google.com; base-uri 'self'; object-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e11" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Agenda" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Navegação"></aside>
      <main class="main">
        <header class="topbar" id="topbar"></header>
        <section class="view" id="view" aria-live="polite"></section>
      </main>
      <nav class="bottomnav" id="bottomnav" aria-label="Navegação principal"></nav>
      <button class="fab" id="fab" aria-label="Novo"></button>
    </div>
    <div id="modal-root"></div>
    <div id="toasts"></div>
    <noscript>Ative o JavaScript para usar a Agenda.</noscript>
  </body>
</html>
